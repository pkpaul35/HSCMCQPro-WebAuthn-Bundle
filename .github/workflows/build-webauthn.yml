
name: Build HSCMCQPro WebAuthn Vendor ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring, sodium
          tools: composer:v2
          coverage: none

      - name: Create WebAuthn Composer project
        run: |
          mkdir -p bundle
          cd bundle
          composer init --no-interaction \
            --name="hscmcqpro/webauthn-bundle"
          composer require --no-interaction \
            --prefer-dist lbuchs/webauthn

      - name: Verify installation
        run: |
          test -f bundle/vendor/autoload.php
          composer --working-dir=bundle validate --no-check-publish
          composer --working-dir=bundle check-platform-reqs

      - name: Create ZIP
        run: |
          cd bundle
          zip -r ../HSCMCQPro-WebAuthn-Vendor.zip \
            vendor composer.json composer.lock

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSCMCQPro-WebAuthn-Vendor
          path: HSCMCQPro-WebAuthn-Vendor.zip
          if-no-files-found: error
          retention-days: 14

